# Local development databases. Two variants, each on its own volume, so they never mix:
#   seeded (demo users, spots, reservations, payments):  docker compose up -d                  -> localhost:5432
#                                                        SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
#   empty (schema and reference data only):              docker compose --profile empty up -d postgres-empty  -> localhost:5433
#                                                        SPRING_PROFILES_ACTIVE=local,empty ./gradlew bootRun
# Which variant a database is decides the application at its first start (Flyway locations), see README.
services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: pari-postgres
    environment:
      POSTGRES_DB: pari
      POSTGRES_USER: pari
      POSTGRES_PASSWORD: pari
    ports:
      - "5432:5432"
    volumes:
      - pari-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pari -d pari"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-empty:
    image: postgis/postgis:16-3.5
    container_name: pari-postgres-empty
    profiles: ["empty"]
    environment:
      POSTGRES_DB: pari
      POSTGRES_USER: pari
      POSTGRES_PASSWORD: pari
    ports:
      - "5433:5432"
    volumes:
      - pari-pgdata-empty:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pari -d pari"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pari-pgdata:
  pari-pgdata-empty:
