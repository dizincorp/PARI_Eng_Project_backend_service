# Local development databases. The default is a CLEAN database (schema and reference data only, no users); the demo
# data is optional. Each variant has its own volume, so they never mix:
#   clean (default):  docker compose up -d                                        -> localhost:5432
#                     SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
#   seeded (demo):    docker compose --profile seed up -d postgres-seeded         -> localhost:5433
#                     SPRING_PROFILES_ACTIVE=local,seed ./gradlew bootRun
# The variant a database has is decided by the application's first start (Flyway locations), see README.
services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: pari-postgres
    environment:
      POSTGRES_DB: pari
      POSTGRES_USER: pari
      POSTGRES_PASSWORD: pari
    ports:
      - "5432:5432"
    volumes:
      - pari-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pari -d pari"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-seeded:
    image: postgis/postgis:16-3.5
    container_name: pari-postgres-seeded
    profiles: ["seed"]
    environment:
      POSTGRES_DB: pari
      POSTGRES_USER: pari
      POSTGRES_PASSWORD: pari
    ports:
      - "5433:5432"
    volumes:
      - pari-pgdata-seeded:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pari -d pari"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pari-pgdata:
  pari-pgdata-seeded:
