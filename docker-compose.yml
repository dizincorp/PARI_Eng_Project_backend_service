# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: pari-postgres
    environment:
      POSTGRES_DB: pari
      POSTGRES_USER: pari
      POSTGRES_PASSWORD: pari
    ports:
      - "5432:5432"
    volumes:
      - pari-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pari -d pari"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pari-pgdata:
